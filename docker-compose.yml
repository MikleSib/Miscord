services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: miscord
      POSTGRES_USER: miscord_user
      POSTGRES_PASSWORD: miscord_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - miscord_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-miscord_user} -d $${POSTGRES_DB:-miscord}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    networks:
      - miscord_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    image: miscord-backend
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment: &backend_environment
      DATABASE_URL: postgresql://miscord_user:miscord_password@postgres:5432/miscord
      REDIS_URL: redis://redis:6379
      VOICE_MEDIA_JWT_SECRET: ${VOICE_MEDIA_JWT_SECRET:-local-voice-media-secret-change-me-32-bytes}
      VOICE_MEDIA_WS_URL: ${VOICE_MEDIA_WS_URL:-wss://miscord.ru/ws/media}
      VOICE_MEDIA_AUDIENCE: miscord-voice-media
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SERVER_HOST: ${SERVER_HOST:-https://miscord.ru}
      WEBHOOKS_ENABLED: "true"
      WEBHOOK_FILES_ENABLED: "true"
      WEBHOOK_TOKEN_ENCRYPTION_KEY: ${WEBHOOK_TOKEN_ENCRYPTION_KEY:-}
      BOT_PLATFORM_ENABLED: ${BOT_PLATFORM_ENABLED:-false}
      THREADS_ENABLED: ${THREADS_ENABLED:-false}
      FORUMS_ENABLED: ${FORUMS_ENABLED:-false}
      POLLS_ENABLED: ${POLLS_ENABLED:-false}
      INBOX_ENABLED: ${INBOX_ENABLED:-false}
      SERVER_TEMPLATES_ENABLED: ${SERVER_TEMPLATES_ENABLED:-false}
      SERVER_IMPORTS_ENABLED: ${SERVER_IMPORTS_ENABLED:-true}
      SOURCE_IMPORT_CLIENT_ID: ${SOURCE_IMPORT_CLIENT_ID:-}
      SOURCE_IMPORT_CLIENT_SECRET: ${SOURCE_IMPORT_CLIENT_SECRET:-}
      SOURCE_IMPORT_BOT_TOKEN: ${SOURCE_IMPORT_BOT_TOKEN:-}
      EXTERNAL_IMPORT_ENCRYPTION_KEY: ${EXTERNAL_IMPORT_ENCRYPTION_KEY:-}
      EXTERNAL_IMPORT_TTL_HOURS: ${EXTERNAL_IMPORT_TTL_HOURS:-24}
      BOT_SECRET_ENCRYPTION_KEY: ${BOT_SECRET_ENCRYPTION_KEY:-}
      ATTACHMENT_SIGNING_KEY: ${ATTACHMENT_SIGNING_KEY:-}
      ATTACHMENT_STORAGE_DIR: /app/data/attachments
      ATTACHMENT_QUARANTINE_DIR: /app/data/quarantine
      ATTACHMENT_X_ACCEL_ENABLED: "true"
      S3_ENABLED: ${S3_ENABLED:-false}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://s3.twcstorage.ru}
      S3_REGION: ${S3_REGION:-ru-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-miscord}
      S3_CDN_BASE_URL: ${S3_CDN_BASE_URL:-}
      S3_CDN_SECURE_TOKEN: ${S3_CDN_SECURE_TOKEN:-}
      S3_DELIVERY_URL_TTL_SECONDS: ${S3_DELIVERY_URL_TTL_SECONDS:-86400}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here-change-in-production}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-ssl}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Miscord}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@miscord.ru}
      MAIL_SUPPORT_ADDRESS: ${MAIL_SUPPORT_ADDRESS:-support@miscord.ru}
      MAIL_SALES_ADDRESS: ${MAIL_SALES_ADDRESS:-sales@miscord.ru}
      EMAIL_VERIFICATION_ENABLED: ${EMAIL_VERIFICATION_ENABLED:-false}
      EMAIL_VERIFICATION_SECRET: ${EMAIL_VERIFICATION_SECRET:-}
      CORS_ORIGINS: '["http://localhost:3000", "https://miscord.ru", "https://www.miscord.ru"]'
      ICE_SERVERS: '${ICE_SERVERS:-[{"urls":["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]},{"urls":["turn:miscord.ru:3478?transport=udp","turn:miscord.ru:3478?transport=tcp"],"username":"miscord","credential":"change-this-turn-password"}]}'
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - media_data:/app/static/uploads
      - attachment_data:/app/data/attachments
      - attachment_quarantine:/app/data/quarantine
    networks:
      - miscord_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --no-access-log
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s

  backend-migrate:
    image: miscord-backend
    restart: "no"
    environment: *backend_environment
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - miscord_network
    command: alembic upgrade head

  voice-media:
    build: ./voice-media
    restart: unless-stopped
    environment:
      NODE_ENV: ${ENVIRONMENT:-development}
      REDIS_URL: redis://redis:6379
      VOICE_MEDIA_JWT_SECRET: ${VOICE_MEDIA_JWT_SECRET:-local-voice-media-secret-change-me-32-bytes}
      VOICE_MEDIA_AUDIENCE: miscord-voice-media
      VOICE_MEDIA_ANNOUNCED_ADDRESS: ${VOICE_MEDIA_ANNOUNCED_ADDRESS:-127.0.0.1}
      VOICE_MEDIA_WORKERS: ${VOICE_MEDIA_WORKERS:-12}
      VOICE_MEDIA_WEBRTC_PORT_MIN: "20000"
      VOICE_MEDIA_WEBRTC_PORT_MAX: "20015"
      VOICE_MEDIA_BOT_UDP_PORT_MIN: "20100"
      VOICE_MEDIA_BOT_UDP_PORT_MAX: "20103"
    expose:
      - "3001"
    ports:
      - "20000-20015:20000-20015/udp"
      - "20000-20015:20000-20015/tcp"
      - "20100-20103:20100-20103/udp"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - miscord_network
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://miscord.ru
        NEXT_PUBLIC_WS_URL: wss://miscord.ru
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - miscord_network
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://miscord.ru
      - NEXT_PUBLIC_WS_URL=wss://miscord.ru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  clamav:
    image: clamav/clamav:stable
    volumes:
      - clamav_db:/var/lib/clamav
    networks:
      - miscord_network

  nginx:
    image: nginx:1.25-alpine
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "127.0.0.1:8443:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./backend/static:/app/static
      - media_data:/app/static/uploads:ro
      - attachment_data:/app/data/attachments:ro
    depends_on:
      - frontend
      - backend
      - voice-media
    networks:
      - miscord_network
    restart: unless-stopped
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  coturn:
    image: coturn/coturn:4.6
    container_name: miscord-coturn
    network_mode: host
    restart: unless-stopped
    command: >
      --no-cli
      --no-tls
      --no-dtls
      --fingerprint
      --lt-cred-mech
      --user=${TURN_USERNAME:-miscord}:${TURN_PASSWORD:-change-this-turn-password}
      --realm=${TURN_REALM:-miscord.ru}
      --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      --listening-port=3478
      --min-port=49152
      --max-port=53247
      --no-software-attribute
      --log-file=stdout

volumes:
  media_data:
  postgres_data:
  attachment_data:
  attachment_quarantine:
  clamav_db:

networks:
  miscord_network:
    driver: bridge
