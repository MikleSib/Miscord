services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: miscord
      POSTGRES_USER: miscord_user
      POSTGRES_PASSWORD: miscord_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - miscord_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-miscord_user} -d $${POSTGRES_DB:-miscord}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - miscord_network

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://miscord_user:miscord_password@postgres:5432/miscord
      REDIS_URL: redis://redis:6379
      WEBHOOKS_ENABLED: "true"
      WEBHOOK_FILES_ENABLED: "true"
      WEBHOOK_TOKEN_ENCRYPTION_KEY: ${WEBHOOK_TOKEN_ENCRYPTION_KEY:-}
      ATTACHMENT_SIGNING_KEY: ${ATTACHMENT_SIGNING_KEY:-}
      ATTACHMENT_STORAGE_DIR: /app/data/attachments
      ATTACHMENT_QUARANTINE_DIR: /app/data/quarantine
      ATTACHMENT_X_ACCEL_ENABLED: "true"
      S3_ENABLED: ${S3_ENABLED:-false}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://s3.twcstorage.ru}
      S3_REGION: ${S3_REGION:-ru-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-miscord}
      S3_CDN_BASE_URL: ${S3_CDN_BASE_URL:-}
      S3_CDN_SECURE_TOKEN: ${S3_CDN_SECURE_TOKEN:-}
      S3_DELIVERY_URL_TTL_SECONDS: ${S3_DELIVERY_URL_TTL_SECONDS:-86400}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      SECRET_KEY: your-secret-key-here-change-in-production
      CORS_ORIGINS: '["http://localhost:3000", "https://miscord.ru", "https://www.miscord.ru"]'
      ICE_SERVERS: '${ICE_SERVERS:-[{"urls":["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]},{"urls":["turn:miscord.ru:3478?transport=udp","turn:miscord.ru:3478?transport=tcp"],"username":"miscord","credential":"change-this-turn-password"}]}'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - media_data:/app/static/uploads
      - attachment_data:/app/data/attachments
      - attachment_quarantine:/app/data/quarantine
    networks:
      - miscord_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --no-access-log

  frontend:
    build: 
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://miscord.ru
        NEXT_PUBLIC_WS_URL: wss://miscord.ru
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - miscord_network
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://miscord.ru
      - NEXT_PUBLIC_WS_URL=wss://miscord.ru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  clamav:
    image: clamav/clamav:stable
    volumes:
      - clamav_db:/var/lib/clamav
    networks:
      - miscord_network

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./backend/static:/app/static
      - media_data:/app/static/uploads:ro
      - attachment_data:/app/data/attachments:ro
    depends_on:
      - frontend
      - backend
    networks:
      - miscord_network
    restart: unless-stopped
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  coturn:
    image: coturn/coturn:4.6
    container_name: miscord-coturn
    network_mode: host
    restart: unless-stopped
    command: >
      --no-cli
      --no-tls
      --no-dtls
      --fingerprint
      --lt-cred-mech
      --user=${TURN_USERNAME:-miscord}:${TURN_PASSWORD:-change-this-turn-password}
      --realm=${TURN_REALM:-miscord.ru}
      --external-ip=${TURN_EXTERNAL_IP:?Set TURN_EXTERNAL_IP in .env}
      --listening-port=3478
      --min-port=49152
      --max-port=49252
      --no-software-attribute
      --log-file=stdout

volumes:
  media_data:
  postgres_data:
  attachment_data:
  attachment_quarantine:
  clamav_db:

networks:
  miscord_network:
    driver: bridge
