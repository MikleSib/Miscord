services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: miscord
      POSTGRES_USER: miscord_user
      POSTGRES_PASSWORD: miscord_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - miscord_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miscord_user -d miscord"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    networks:
      - miscord_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://miscord_user:miscord_password@postgres:5432/miscord
      REDIS_URL: redis://redis:6379
      WEBHOOKS_ENABLED: "true"
      WEBHOOK_FILES_ENABLED: "true"
      WEBHOOK_TOKEN_ENCRYPTION_KEY: ${WEBHOOK_TOKEN_ENCRYPTION_KEY:-}
      ATTACHMENT_SIGNING_KEY: ${ATTACHMENT_SIGNING_KEY:-}
      ATTACHMENT_STORAGE_DIR: /app/data/attachments
      ATTACHMENT_QUARANTINE_DIR: /app/data/quarantine
      ATTACHMENT_X_ACCEL_ENABLED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a long random string}
      ENVIRONMENT: production
      CORS_ORIGINS: '["https://stream-cash.ru", "https://www.stream-cash.ru"]'
      SERVER_HOST: https://stream-cash.ru
      ICE_SERVERS: '${ICE_SERVERS:-[{"urls":["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]},{"urls":["turn:stream-cash.ru:3478?transport=udp","turn:stream-cash.ru:3478?transport=tcp"],"username":"miscord","credential":"change-this-turn-password"}]}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/static:/app/static
      - attachment_data:/app/data/attachments
      - attachment_quarantine:/app/data/quarantine
    networks:
      - miscord_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://stream-cash.ru
        NEXT_PUBLIC_WS_URL: wss://stream-cash.ru
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://stream-cash.ru
      - NEXT_PUBLIC_WS_URL=wss://stream-cash.ru
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - miscord_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  coturn:
    image: coturn/coturn:4.6
    network_mode: host
    restart: unless-stopped
    command:
      - --no-cli
      - --no-tls
      - --no-dtls
      - --fingerprint
      - --lt-cred-mech
      - --user=${TURN_USERNAME:-miscord}:${TURN_PASSWORD:-change-this-turn-password}
      - --realm=${TURN_REALM:-stream-cash.ru}
      - --external-ip=${TURN_EXTERNAL_IP:?Set TURN_EXTERNAL_IP in .env}
      - --listening-port=3478
      - --min-port=49152
      - --max-port=49252
      - --no-software-attribute
      - --log-file=stdout

  clamav:
    image: clamav/clamav:stable
    volumes:
      - clamav_db:/var/lib/clamav
    networks:
      - miscord_network
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./backend/static:/app/static
      - attachment_data:/app/data/attachments:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - miscord_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - miscord_network
    restart: unless-stopped
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

volumes:
  postgres_data:
    driver: local
  attachment_data:
  attachment_quarantine:
  clamav_db:

networks:
  miscord_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
