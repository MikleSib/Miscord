# Miscord на домашнем сервере (floory / 192.168.0.197)
# TLS уже на host nginx → 127.0.0.1:8443
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: miscord
      POSTGRES_USER: miscord_user
      POSTGRES_PASSWORD: miscord_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - miscord_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miscord_user -d miscord"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    networks:
      - miscord_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://miscord_user:miscord_password@postgres:5432/miscord
      REDIS_URL: redis://redis:6379
      WEBHOOKS_ENABLED: "true"
      WEBHOOK_FILES_ENABLED: "true"
      WEBHOOK_TOKEN_ENCRYPTION_KEY: ${WEBHOOK_TOKEN_ENCRYPTION_KEY:-}
      ATTACHMENT_SIGNING_KEY: ${ATTACHMENT_SIGNING_KEY:-}
      ATTACHMENT_STORAGE_DIR: /app/data/attachments
      ATTACHMENT_QUARANTINE_DIR: /app/data/quarantine
      ATTACHMENT_X_ACCEL_ENABLED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a long random string}
      ENVIRONMENT: production
      CORS_ORIGINS: '["https://miscord.ru", "https://www.miscord.ru", "http://localhost:3000"]'
      SERVER_HOST: https://miscord.ru
      # ICE_SERVERS задавайте в .env на сервере (не храните TURN-пароли в git)
      ICE_SERVERS: ${ICE_SERVERS:-[{"urls":["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]}]}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/static/uploads
      - attachment_data:/app/data/attachments
      - attachment_quarantine:/app/data/quarantine
    networks:
      - miscord_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://miscord.ru
        NEXT_PUBLIC_WS_URL: wss://miscord.ru
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://miscord.ru
      NEXT_PUBLIC_WS_URL: wss://miscord.ru
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - miscord_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  coturn:
    image: coturn/coturn:4.6
    network_mode: host
    restart: unless-stopped
    command:
      - --no-cli
      - --no-tls
      - --no-dtls
      - --fingerprint
      - --lt-cred-mech
      - --user=${TURN_USERNAME:-miscord}:${TURN_PASSWORD:-change-this-turn-password}
      - --realm=${TURN_REALM:-miscord.ru}
      - --external-ip=${TURN_EXTERNAL_IP:?Set TURN_EXTERNAL_IP in .env}
      - --listening-port=3478
      - --min-port=49152
      - --max-port=49252
      - --no-software-attribute
      - --log-file=stdout

  clamav:
    image: clamav/clamav:stable
    volumes:
      - clamav_db:/var/lib/clamav
    networks:
      - miscord_network
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "127.0.0.1:8443:80"
    volumes:
      - ./nginx/nginx.server.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/app/static/uploads:ro
      - attachment_data:/app/data/attachments:ro
    depends_on:
      - frontend
      - backend
    networks:
      - miscord_network
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  attachment_data:
  attachment_quarantine:
  clamav_db:

networks:
  miscord_network:
    driver: bridge
