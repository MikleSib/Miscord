# Miscord на домашнем сервере (floory / 192.168.0.197)
# TLS уже на host nginx → 127.0.0.1:8443
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: miscord
      POSTGRES_USER: miscord_user
      POSTGRES_PASSWORD: miscord_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - miscord_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miscord_user -d miscord"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    networks:
      - miscord_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://miscord_user:miscord_password@postgres:5432/miscord
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-miscord-prod-secret-change-me-please-9f3a2c}
      CORS_ORIGINS: '["https://miscord.ru", "https://www.miscord.ru", "http://localhost:3000"]'
      SERVER_HOST: https://miscord.ru
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/static:/app/static
    networks:
      - miscord_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://miscord.ru
        NEXT_PUBLIC_WS_URL: wss://miscord.ru
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://miscord.ru
      NEXT_PUBLIC_WS_URL: wss://miscord.ru
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - miscord_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "127.0.0.1:8443:80"
    volumes:
      - ./nginx/nginx.server.conf:/etc/nginx/nginx.conf:ro
      - ./backend/static:/app/static:ro
    depends_on:
      - frontend
      - backend
    networks:
      - miscord_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  miscord_network:
    driver: bridge
