name: miscord-voice-local

services:
  postgres:
    environment:
      POSTGRES_DB: miscord_local
      POSTGRES_USER: miscord_local
      POSTGRES_PASSWORD: miscord_local_password

  redis:
    ports: !override []

  backend:
    environment:
      DATABASE_URL: postgresql://miscord_local:miscord_local_password@postgres:5432/miscord_local
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: development
      SERVER_HOST: http://127.0.0.1:3011
      SECRET_KEY: local-backend-secret-change-me
      VOICE_MEDIA_JWT_SECRET: local-voice-media-secret-change-me-32-bytes
      VOICE_MEDIA_WS_URL: ws://127.0.0.1:3011/ws/media
      BOT_PLATFORM_ENABLED: "true"
      CORS_ORIGINS: '["http://127.0.0.1:3011","http://localhost:3011"]'
    ports: !override []
    volumes:
      - ./backend:/app
      - local_media_data:/app/static/uploads
      - local_attachment_data:/app/data/attachments
      - local_attachment_quarantine:/app/data/quarantine

  voice-media:
    environment:
      NODE_ENV: development
      VOICE_MEDIA_JWT_SECRET: local-voice-media-secret-change-me-32-bytes
      VOICE_MEDIA_ANNOUNCED_ADDRESS: 127.0.0.1
      VOICE_MEDIA_WORKERS: "2"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:3011
        NEXT_PUBLIC_WS_URL: ws://127.0.0.1:3011
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3011
      NEXT_PUBLIC_WS_URL: ws://127.0.0.1:3011

  nginx:
    ports: !override
      - "127.0.0.1:3011:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/static:/app/static:ro
      - local_media_data:/app/static/uploads:ro
      - local_attachment_data:/app/data/attachments:ro

  coturn:
    network_mode: !reset null
    networks:
      - miscord_network
    ports:
      - "127.0.0.1:3479:3479/tcp"
      - "127.0.0.1:3479:3479/udp"
      - "54000-54031:54000-54031/udp"
    command: >
      --no-cli --no-tls --no-dtls --fingerprint --lt-cred-mech
      --user=miscord-local:miscord-local-turn-password
      --realm=localhost --external-ip=127.0.0.1 --listening-port=3479
      --min-port=54000 --max-port=54031 --no-software-attribute --log-file=stdout

volumes:
  local_media_data:
  local_attachment_data:
  local_attachment_quarantine:
