services:
  redis:
    image: redis:7-alpine
    networks:
      - miscord_network

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://miscord_user:miscord_password@host.docker.internal:5432/miscord
      REDIS_URL: redis://redis:6379
      SECRET_KEY: your-secret-key-for-development-change-in-production
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - ./backend:/app
    networks:
      - miscord_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  miscord_network:
    driver: bridge
